[project]
name = "schema-faker"
version = "0.1.0"
description = "Configurable synthetic data generator for dev/test environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "faker>=19.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.5.0",
]

[project.scripts]
schema-faker = "schema_faker.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.15.15",
]
test = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]  # PEP 8, pyflakes, warnings, imports, naming, pyupgrade
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-config=.coveragerc --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]